services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: educore-server

    ports:
      - "3000:3000"

    env_file:
      - ./server/.env.docker

    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:latest
    container_name: educore-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:latest
    container_name: educore-redis
    ports:
     - "6379:6379"

volumes:
  mongo_data: